<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить трату</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, sans-serif;
      color: #f0f0ff;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      position: relative;
    }
    /* Фоновая картинка */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: -2;
    }
    /* Затемняющий слой поверх картинки, чтобы текст было видно на любом фото */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 5, 10, 0.6);
      z-index: -1;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #9a8fd6;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #3d2f6b;
      background-color: #14102a;
      color: #f0f0ff;
      outline: none;
    }
    input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    }
    /* Кнопка-заменитель select для категории и счёта */
    .picker-btn {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      text-align: left;
      border-radius: 10px;
      border: 1px solid #3d2f6b;
      background-color: #14102a;
      color: #f0f0ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .picker-btn:active {
      border-color: #ff2ec4;
      box-shadow: 0 0 10px rgba(255, 46, 196, 0.7);
    }
    .picker-btn .placeholder { color: #6b6390; }
    .picker-btn .arrow { color: #00e5ff; text-shadow: 0 0 6px rgba(0,229,255,0.8); }

    button.save {
      width: 100%;
      margin-top: 26px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid #ff2ec4;
      border-radius: 10px;
      background: linear-gradient(135deg, #1a0b33, #2a0e4a);
      color: #ff6ee0;
      text-shadow: 0 0 8px rgba(255, 110, 224, 0.9);
      box-shadow: 0 0 14px rgba(255, 46, 196, 0.5), inset 0 0 10px rgba(255, 46, 196, 0.15);
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    button.save:active {
      box-shadow: 0 0 22px rgba(255, 46, 196, 0.9), inset 0 0 14px rgba(255, 46, 196, 0.3);
    }

    /* Панель выбора категории (bottom sheet) */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 10;
    }
    .overlay.open { display: block; }
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 75vh;
      overflow-y: auto;
      background: linear-gradient(180deg, #14102a, #0a0818);
      border: 1px solid #3d2f6b;
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      padding-bottom: 32px;
      box-shadow: 0 -6px 24px rgba(0, 229, 255, 0.15);
    }
    .sheet-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0,229,255,0.6);
    }
    .cat-item {
      padding: 13px 10px;
      border-radius: 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #f0f0ff;
    }
    .cat-item:active {
      background-color: rgba(0, 229, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3) inset;
    }
    .cat-item .left { display: flex; align-items: center; gap: 10px; }
    .cat-icon {
      font-size: 20px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 46, 196, 0.12);
    }
    .cat-item .chevron { color: #00e5ff; }

    .back-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 4px 14px 4px;
      font-size: 15px;
      color: #00e5ff;
      text-shadow: 0 0 6px rgba(0,229,255,0.5);
    }
  </style>
</head>
<body>

  <label for="date">Дата</label>
  <input type="date" id="date">

  <label for="amount">Сумма</label>
  <input type="number" id="amount" placeholder="0">

  <label>Счёт</label>
  <div class="picker-btn" onclick="openSheet('account')">
    <span id="account-label" class="placeholder">Выбрать счёт</span>
    <span class="arrow">›</span>
  </div>

  <label>Категория</label>
  <div class="picker-btn" onclick="openSheet('category')">
    <span id="category-label" class="placeholder">Выбрать категорию</span>
    <span class="arrow">›</span>
  </div>

  <label for="description">Описание (необязательно)</label>
  <input type="text" id="description" placeholder="Например: пообедал на работе">

  <button class="save" onclick="submitForm()">Сохранить</button>

  <!-- Панель выбора счёта -->
  <div class="overlay" id="overlay-account" onclick="closeSheet('account', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">Счёт</div>
      <div id="account-list"></div>
    </div>
  </div>

  <!-- Панель выбора категории -->
  <div class="overlay" id="overlay-category" onclick="closeSheet('category', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">Категория</div>
      <div id="category-list"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('date').valueAsDate = new Date();

    let selectedAccount = null;
    let selectedCategory = null;

    const accounts = [
      { id: 1, name: "Наличные", icon: "💵" },
      { id: 2, name: "Карта Uzcard", icon: "💳" },
      { id: 3, name: "Карта Humo", icon: "💳" },
      { id: 4, name: "Карта Visa", icon: "💳" },
    ];

    const categories = [
      { group: "Еда", icon: "🍽", items: [
        { id: 1, name: "Еда (общее)" },
        { id: 8, name: "Кафе и рестораны" },
        { id: 9, name: "Продукты" },
        { id: 17, name: "Сладости, перекус, попить" },
        { id: 18, name: "Обед" },
      ]},
      { group: "Транспорт", icon: "🚕", items: [
        { id: 2, name: "Транспорт (общее)" },
        { id: 10, name: "Такси" },
        { id: 11, name: "Общественный транспорт" },
      ]},
      { group: "Жильё", icon: "🏠", items: [
        { id: 3, name: "Жильё (общее)" },
        { id: 12, name: "Коммуналка" },
        { id: 13, name: "Аренда" },
      ]},
      { group: "Развлечения", icon: "🎬", items: [
        { id: 4, name: "Развлечения (общее)" },
        { id: 14, name: "Кино и подписки" },
        { id: 29, name: "Шопинг" },
      ]},
      { group: "Здоровье", icon: "💊", items: [
        { id: 5, name: "Здоровье (общее)" },
        { id: 15, name: "Спортзал" },
        { id: 16, name: "Лекарства" },
      ]},
      { group: "Жене", icon: "👩", items: [
        { id: 19, name: "Жене (общее)" },
        { id: 20, name: "Обед жене" },
        { id: 21, name: "Такси жене" },
        { id: 22, name: "Общественный транспорт для жены" },
        { id: 25, name: "Кафе и рестораны" },
        { id: 26, name: "Сладости, перекус, попить жене" },
        { id: 30, name: "Шопинг для жены" },
      ]},
      { group: "Сыну", icon: "🧒", items: [
        { id: 23, name: "Сыну (общее)" },
        { id: 24, name: "Игрушки сыну" },
        { id: 31, name: "Шопинг для сына" },
      ]},
      { group: "Кредиты", icon: "🏦", items: [
        { id: 27, name: "Кредиты (общее)" },
        { id: 28, name: "Кредиты Uzum" },
      ]},
      { group: "Бизнес с Акромом (расход)", icon: "📉", items: [
        { id: 7, name: "Бизнес с Акромом расход (общее)" },
        { id: 33, name: "Инвестиция в 3Д бизнес с Акромом" },
      ]},
      { group: "Бизнес с Акромом (доход)", icon: "📈", items: [
        { id: 34, name: "Бизнес с Акромом доход (общее)" },
        { id: 35, name: "Доход с 3Д бизнеса с Акромом" },
      ]},
      { group: "Зарплата", icon: "💰", items: [
        { id: 6, name: "Зарплата (общее)" },
        { id: 32, name: "Зарплата с работы" },
      ]},
    ];

    // Рисуем список счетов
    const accountListEl = document.getElementById('account-list');
    accounts.forEach(acc => {
      const el = document.createElement('div');
      el.className = 'cat-item';
      el.innerHTML = `<span class="cat-icon">${acc.icon}</span><span>${acc.name}</span>`;
      el.onclick = () => {
        selectedAccount = acc.id;
        document.getElementById('account-label').textContent = acc.name;
        document.getElementById('account-label').classList.remove('placeholder');
        closeSheet('account');
      };
      accountListEl.appendChild(el);
    });

    // Двухуровневый рендер категорий: сначала разделы, потом подкатегории
    const categoryListEl = document.getElementById('category-list');
    const categorySheetTitle = document.querySelector('#overlay-category .sheet-title');

    function renderCategoryGroups() {
      categorySheetTitle.textContent = 'Категория';
      categoryListEl.innerHTML = '';
      categories.forEach(group => {
        const el = document.createElement('div');
        el.className = 'cat-item';
        el.innerHTML = `
          <span class="left"><span class="cat-icon">${group.icon}</span><span>${group.group}</span></span>
          <span class="chevron">›</span>
        `;
        el.onclick = () => renderCategoryItems(group);
        categoryListEl.appendChild(el);
      });
    }

    function renderCategoryItems(group) {
      categorySheetTitle.textContent = group.group;
      categoryListEl.innerHTML = '';

      const backEl = document.createElement('div');
      backEl.className = 'back-row';
      backEl.innerHTML = `‹ Назад`;
      backEl.onclick = renderCategoryGroups;
      categoryListEl.appendChild(backEl);

      group.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'cat-item';
        el.innerHTML = `<span class="left"><span class="cat-icon">${group.icon}</span><span>${item.name}</span></span>`;
        el.onclick = () => {
          selectedCategory = item.id;
          document.getElementById('category-label').textContent = `${group.group} → ${item.name}`;
          document.getElementById('category-label').classList.remove('placeholder');
          closeSheet('category');
        };
        categoryListEl.appendChild(el);
      });
    }

    renderCategoryGroups();

    function openSheet(name) {
      if (name === 'category') renderCategoryGroups();
      document.getElementById('overlay-' + name).classList.add('open');
    }
    function closeSheet(name, event) {
      document.getElementById('overlay-' + name).classList.remove('open');
    }

    function submitForm() {
      if (!selectedAccount || !selectedCategory) {
        tg.showAlert('Выбери счёт и категорию');
        return;
      }
      const data = {
        date: document.getElementById('date').value,
        amount: document.getElementById('amount').value,
        account_id: selectedAccount,
        category_id: selectedCategory,
        description: document.getElementById('description').value
      };
      tg.sendData(JSON.stringify(data));
    }
  </script>

</body>
</html>
