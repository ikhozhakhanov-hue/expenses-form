<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить трату</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 16px;
      margin: 0;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 14px;
      opacity: 0.7;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
    }
    /* Кнопка-заменитель select для категории и счёта */
    .picker-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      text-align: left;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .picker-btn .placeholder { opacity: 0.5; }
    .picker-btn .arrow { opacity: 0.5; }

    button.save {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
    }

    /* Панель выбора категории (bottom sheet) */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 10;
    }
    .overlay.open { display: block; }
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 75vh;
      overflow-y: auto;
      background-color: var(--tg-theme-bg-color, #ffffff);
      border-radius: 16px 16px 0 0;
      padding: 16px;
      padding-bottom: 32px;
    }
    .sheet-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }
    .cat-item {
      padding: 12px 10px;
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .cat-item:active {
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    .cat-item .left { display: flex; align-items: center; gap: 10px; }
    .cat-icon { font-size: 20px; width: 24px; text-align: center; }
    .cat-item .chevron { opacity: 0.4; }

    .back-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 4px 14px 4px;
      font-size: 15px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <label for="date">Дата</label>
  <input type="date" id="date">

  <label for="amount">Сумма</label>
  <input type="number" id="amount" placeholder="0">

  <label>Счёт</label>
  <div class="picker-btn" onclick="openSheet('account')">
    <span id="account-label" class="placeholder">Выбрать счёт</span>
    <span class="arrow">›</span>
  </div>

  <label>Категория</label>
  <div class="picker-btn" onclick="openSheet('category')">
    <span id="category-label" class="placeholder">Выбрать категорию</span>
    <span class="arrow">›</span>
  </div>

  <label for="description">Описание (необязательно)</label>
  <input type="text" id="description" placeholder="Например: пообедал на работе">

  <button class="save" onclick="submitForm()">Сохранить</button>

  <!-- Панель выбора счёта -->
  <div class="overlay" id="overlay-account" onclick="closeSheet('account', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">Счёт</div>
      <div id="account-list"></div>
    </div>
  </div>

  <!-- Панель выбора категории -->
  <div class="overlay" id="overlay-category" onclick="closeSheet('category', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">Категория</div>
      <div id="category-list"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('date').valueAsDate = new Date();

    let selectedAccount = null;
    let selectedCategory = null;

    const accounts = [
      { id: 1, name: "Наличные", icon: "💵" },
      { id: 2, name: "Карта Uzcard", icon: "💳" },
      { id: 3, name: "Карта Humo", icon: "💳" },
      { id: 4, name: "Карта Visa", icon: "💳" },
    ];

    const categories = [
      { group: "Еда", icon: "🍽", items: [
        { id: 1, name: "Еда (общее)" },
        { id: 8, name: "Кафе и рестораны" },
        { id: 9, name: "Продукты" },
        { id: 17, name: "Сладости, перекус, попить" },
        { id: 18, name: "Обед" },
      ]},
      { group: "Транспорт", icon: "🚕", items: [
        { id: 2, name: "Транспорт (общее)" },
        { id: 10, name: "Такси" },
        { id: 11, name: "Общественный транспорт" },
      ]},
      { group: "Жильё", icon: "🏠", items: [
        { id: 3, name: "Жильё (общее)" },
        { id: 12, name: "Коммуналка" },
        { id: 13, name: "Аренда" },
      ]},
      { group: "Развлечения", icon: "🎬", items: [
        { id: 4, name: "Развлечения (общее)" },
        { id: 14, name: "Кино и подписки" },
        { id: 29, name: "Шопинг" },
      ]},
      { group: "Здоровье", icon: "💊", items: [
        { id: 5, name: "Здоровье (общее)" },
        { id: 15, name: "Спортзал" },
        { id: 16, name: "Лекарства" },
      ]},
      { group: "Жене", icon: "👩", items: [
        { id: 19, name: "Жене (общее)" },
        { id: 20, name: "Обед жене" },
        { id: 21, name: "Такси жене" },
        { id: 22, name: "Общественный транспорт для жены" },
        { id: 25, name: "Кафе и рестораны" },
        { id: 26, name: "Сладости, перекус, попить жене" },
        { id: 30, name: "Шопинг для жены" },
      ]},
      { group: "Сыну", icon: "🧒", items: [
        { id: 23, name: "Сыну (общее)" },
        { id: 24, name: "Игрушки сыну" },
        { id: 31, name: "Шопинг для сына" },
      ]},
      { group: "Кредиты", icon: "🏦", items: [
        { id: 27, name: "Кредиты (общее)" },
        { id: 28, name: "Кредиты Uzum" },
      ]},
    ];

    // Рисуем список счетов
    const accountListEl = document.getElementById('account-list');
    accounts.forEach(acc => {
      const el = document.createElement('div');
      el.className = 'cat-item';
      el.innerHTML = `<span class="cat-icon">${acc.icon}</span><span>${acc.name}</span>`;
      el.onclick = () => {
        selectedAccount = acc.id;
        document.getElementById('account-label').textContent = acc.name;
        document.getElementById('account-label').classList.remove('placeholder');
        closeSheet('account');
      };
      accountListEl.appendChild(el);
    });

    // Двухуровневый рендер категорий: сначала разделы, потом подкатегории
    const categoryListEl = document.getElementById('category-list');
    const categorySheetTitle = document.querySelector('#overlay-category .sheet-title');

    function renderCategoryGroups() {
      categorySheetTitle.textContent = 'Категория';
      categoryListEl.innerHTML = '';
      categories.forEach(group => {
        const el = document.createElement('div');
        el.className = 'cat-item';
        el.innerHTML = `
          <span class="left"><span class="cat-icon">${group.icon}</span><span>${group.group}</span></span>
          <span class="chevron">›</span>
        `;
        el.onclick = () => renderCategoryItems(group);
        categoryListEl.appendChild(el);
      });
    }

    function renderCategoryItems(group) {
      categorySheetTitle.textContent = group.group;
      categoryListEl.innerHTML = '';

      const backEl = document.createElement('div');
      backEl.className = 'back-row';
      backEl.innerHTML = `‹ Назад`;
      backEl.onclick = renderCategoryGroups;
      categoryListEl.appendChild(backEl);

      group.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'cat-item';
        el.innerHTML = `<span class="left"><span class="cat-icon">${group.icon}</span><span>${item.name}</span></span>`;
        el.onclick = () => {
          selectedCategory = item.id;
          document.getElementById('category-label').textContent = `${group.group} → ${item.name}`;
          document.getElementById('category-label').classList.remove('placeholder');
          closeSheet('category');
        };
        categoryListEl.appendChild(el);
      });
    }

    renderCategoryGroups();

    function openSheet(name) {
      if (name === 'category') renderCategoryGroups();
      document.getElementById('overlay-' + name).classList.add('open');
    }
    function closeSheet(name, event) {
      document.getElementById('overlay-' + name).classList.remove('open');
    }

    function submitForm() {
      if (!selectedAccount || !selectedCategory) {
        tg.showAlert('Выбери счёт и категорию');
        return;
      }
      const data = {
        date: document.getElementById('date').value,
        amount: document.getElementById('amount').value,
        account_id: selectedAccount,
        category_id: selectedCategory,
        description: document.getElementById('description').value
      };
      tg.sendData(JSON.stringify(data));
    }
  </script>

</body>
</html>
